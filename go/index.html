<title>二十歳のつどい</title>
<script>
  // スマホ・タブレット（タッチ操作で画面が狭い端末）はスマホ版、それ以外はPC版（D案）へ
  (function () {
    var mobile = (window.matchMedia && matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820) || window.innerWidth < 720;
    location.replace(mobile ? '../mobile/' : '../sample4/');
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7dce3;color:#2d5a96;font-family:"Hiragino Sans","Yu Gothic",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  a{color:inherit;display:inline-block;margin:8px;padding:12px 20px;border:1.5px solid currentColor;border-radius:99px;text-decoration:none}
</style>
</head>
<body>
<div>
  <p>二十歳のつどい 案内ページを開いています…</p>
